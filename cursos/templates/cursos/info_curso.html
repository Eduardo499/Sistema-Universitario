{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Universitário</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <div class="admin-container">
        <h1>Informações do Curso</h1>
        <p class="admin-subtitle">Aqui estão as informações detalhadas sobre o curso selecionado.</p>

        <div class="course-info">
            <p><strong>Nome:</strong> {{ curso.nome }}</p>
            <p><strong>Grau:</strong> {{ curso.get_grau_display }}</p>
            <p><strong>Duração (semestres):</strong> {{ curso.qtd_semestres }}</p>
        </div>

    <br>

    <div class="admin-grid">
    <a href="{% url 'cursos:gerenciar_grade_curricular' curso.pk %}">
        <div class="admin-card">
            <img src="{% static 'core/icons/manage-grade.svg' %}" alt="Gerenciar Grade Curricular" class="admin-image">
            <p>Gerenciar Grade</p>
        </div>
    </a>
    <a href="{% url 'cursos:baixar_grade_curricular' curso.pk %}" target="_blank">
        <div class="admin-card">
            <img src="{% static 'core/icons/download.svg' %}" alt="Baixar Grade Curricular" class="admin-image">
            <p>Baixar Grade Curricular</p>
        </div>
    </a>
    </div>
    <br>

    <a href="{% url 'cursos:gerenciar_cursos' %}">
        <button>Voltar ao Gerenciamento de Cursos</button>
    </div>
</body>
</html>
