{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Universitário</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    <div class="admin-container" autocomplete="off">
        <h1>Adicionar Turma</h1>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label>Nome:</label>
                {{ form.nome }}
            </div>
            <div class="form-group">
                <label>Curso:</label>
                {{ form.curso }}
            </div>
            <div class="form-group">
                <label>Ano:</label>
                {{ form.ano }}
            </div>
            <div class="form-group">
                <label>Semestre:</label>
                {{ form.semestre }}
            </div>
            <button type="submit">Adicionar Turma</button>
        </form>
    </div>

</body>
</html>
