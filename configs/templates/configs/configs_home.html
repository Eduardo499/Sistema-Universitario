{% extends 'base.html' %}
{%load static %}

{% block content %}
    <div class="admin-container">
        <h1>Configurações do Sistema</h1>
        <p class="admin-subtitle">Aqui você pode ajustar as configurações do sistema.</p>

        <div class="admin-grid">
                <div class="admin-card" onclick="openThemeModal()">
                    <img src="{% static 'core/icons/theme.svg' %}" alt="Mudar o Tema" class="admin-image">
                    <p>Mudar o Tema</p>
                </div>
        </div>

        <div class="theme-modal-overlay" id="themeModal">
                    <div class="theme-modal">
                        <h2>Escolha um Tema</h2>
                        <div class="theme-grid-modal" id="themeGrid"></div>
                        <button class="theme-close-btn" onclick="closeThemeModal()">Fechar</button>
                    </div>
        </div>
    <br>
    <a href="{% url 'accounts:admin_home' %}">
        <button>Voltar ao Painel de Administração</button>
    </a>
    </div>

    {% block extra_js %}
    <script>
        const themes = [
            { id: 'floresta', name: 'Floresta', bg: '#223240', accent: '#49A671', btn: '#49A671' },
            { id: 'oceano',   name: 'Oceano',   bg: '#0f2033', accent: '#38bdf8', btn: '#0ea5e9' },
            { id: 'violeta',  name: 'Violeta',  bg: '#1a0a2e', accent: '#a855f7', btn: '#9333ea' },
            { id: 'ambar',    name: 'Âmbar',    bg: '#1c1400', accent: '#f59e0b', btn: '#d97706' },
            { id: 'coral',    name: 'Coral',    bg: '#1f0a0a', accent: '#f87171', btn: '#e11d48' },
            { id: 'gelo',     name: 'Gelo',     bg: '#f0f4f8', accent: '#3b82f6', btn: '#3b82f6' },
            { id: 'mint',     name: 'Mint',     bg: '#f0fdf4', accent: '#16a34a', btn: '#16a34a' },
            { id: 'grafite',  name: 'Grafite',  bg: '#111111', accent: '#e5e5e5', btn: '#404040' },
        ];

        // Aplica o tema salvo ao carregar
        const saved = localStorage.getItem('tema') || 'floresta';
        applyTheme(saved);

        function applyTheme(id) {
            document.documentElement.setAttribute('data-theme', id === 'floresta' ? '' : id);
            localStorage.setItem('tema', id);
            renderGrid();
        }

        function renderGrid() {
            const current = localStorage.getItem('tema') || 'floresta';
            document.getElementById('themeGrid').innerHTML = themes.map(t => `
                <div class="theme-option ${t.id === current ? 'active' : ''}" onclick="applyTheme('${t.id}')">
                    <div class="theme-option-preview" style="background:${t.bg}">
                        <div class="theme-dot" style="background:${t.accent}"></div>
                        <div class="theme-dot" style="background:${t.btn}; width:12px"></div>
                    </div>
                    <div class="theme-name">${t.name}</div>
                </div>
            `).join('');
        }

        function openThemeModal() {
            renderGrid();
            document.getElementById('themeModal').classList.add('open');
        }

        function closeThemeModal() {
            document.getElementById('themeModal').classList.remove('open');
        }

        // Fecha ao clicar fora
        document.getElementById('themeModal').addEventListener('click', function(e) {
            if (e.target === this) closeThemeModal();
        });
    </script>
    {% endblock %}
{% endblock %}
