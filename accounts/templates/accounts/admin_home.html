{% extends 'base.html' %}
{% load static %}

{% block content %}
    <div class="admin-container">
        <h1>Olá, {{ user.username }}!</h1>
        <p class="admin-subtitle">Bem-vindo ao painel de administrador.</p>

        <div class="admin-grid">
            <a href="">
            <div class="admin-card">
                <img src="{% static 'core/icons/user-management.svg' %}" alt="Gerenciamento de Usuários" class="admin-image">
                <p>Gerenciamento de Usuários</p>
            </div>
            </a>
            <a href="{% url 'cursos:cursos_home' %}">
                <div class="admin-card">  
                    <img src="{% static 'core/icons/course-management.svg' %}" alt="Gerenciamento de Cursos" class="admin-image">
                    <p>Gerenciamento de Cursos</p>
                </div>
            </a>
            <a href="{% url 'configs:configs_home' %}">
            <div class="admin-card">
                <img src="{% static 'core/icons/settings.svg' %}" alt="Configurações do Sistema" class="admin-image">
                <p>Configurações do Sistema</p>
            </div>
            </a>
    </div>

    <br>

    <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Sair</button>
    </form>
{% endblock %}
