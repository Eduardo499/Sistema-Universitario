{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Universitário</title>
    <link rel="stylesheet" href="{% static 'core/style.css' %}">
</head>
<body>
    
    <div class="login-container">
        <h1>Entrar no Sistema</h1>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">Usuário:</label>
                <input type="text" name="username" id="id_username" required>

            </div>
            <div class="form-group">
                <label for="id_password">Senha:</label>
                <input type="password" name="password" id="id_password" required>
            </div>
            <button type="submit"><strong>Entrar</strong></button>
        </form>

        <p>Não tem uma conta? <a href="{% url 'accounts:register' %}">Cadastre-se</a></p>
        
        <footer>
        <p>&copy; 2026 Sistema Universitário. Todos os direitos reservados.</p>
        </footer>
    </div>

    
</body>
</html>
